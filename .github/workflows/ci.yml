name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build
        run: npm run build
      - name: Check committed runtime files
        run: git diff --exit-code -- lib
      - name: Core tests
        run: npm test
      - name: Validate distributable
        run: npm run pack:plugin
